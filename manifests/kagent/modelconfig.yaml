# The agent side of the change: no apiKeySecret, and the base URL is the sidecar on
# loopback. The gateway passes the model name through to OpenRouter.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: gw-space-bunny-alpha
  namespace: kagent
spec:
  model: stealth/space-bunny-alpha   # any OpenRouter model id
  provider: OpenAI                   # OpenAI-compatible wire format
  openAI:
    baseUrl: "http://127.0.0.1:8081/v1"   # the sidecar, not the internet

# A kagent Agent that reaches its LLM only through llm-gateway. Part 2: the sidecar, token volume and placeholder key
# come from llm-gateway-sidecar-patch.yaml, applied because of the label below, so the Agent itself stays small.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: gw-test-agent
  namespace: kagent
  labels:
    llm-gateway.example.com/enabled: "true"
spec:
  type: Declarative
  description: "Reaches its LLM only via llm-gateway using a short-lived ServiceAccount token"
  declarative:
    runtime: go
    modelConfig: gw-nemotron-3-5-lightning-free
    systemMessage: |
      You are a minimal test agent. Answer briefly. You have no tools.

# EXAMPLE ONLY - shape of the Secret the gateway backend reads. Do not commit a real key.
# Encrypt it (e.g. SOPS + age) or create it out of band. agentgateway's auth.secretRef
# reads the "Authorization" key and sends it as the bearer credential to OpenRouter.
# Use a dedicated OpenRouter key with a credit limit, used by the gateway only.
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-credentials
  namespace: llm-gateway
type: Opaque
stringData:
  Authorization: "<your-openrouter-api-key>"
